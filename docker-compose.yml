version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: prephub-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: prephub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: PrepHub.API/Dockerfile
    container_name: prephub-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=prephub;Username=postgres;Password=postgres"
      Jwt__Key: "YourSuperSecretKeyThatIsAtLeast32CharactersLong!"
      Jwt__Issuer: "PrepHub"
      Jwt__Audience: "PrepHub"
      Jwt__AccessTokenExpirationMinutes: "60"
      Jwt__RefreshTokenExpirationDays: "7"
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: prephub-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
